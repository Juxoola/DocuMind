[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.1.0"
description = "DocuMind — локальный RAG для документов"
requires-python = ">=3.11"

dependencies = [
    # ── Core RAG & LLM ──
    "llama-index-core==0.14.21",
    "llama-index-readers-file==0.5.0",
    "llama-index-llms-openai==0.7.5",
    "llama-index-vector-stores-chroma==0.5.5",
    "llama-index-retrievers-bm25==0.7.1",
    "rank-bm25==0.2.2",
    "chromadb==1.5.8",
    # ── Speech & Audio ──
    # CPU-only torch. CUDA-билды: pip install -r requirements-cuda.txt
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "whisperx==3.8.5",
    # ── Backend ──
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "requests==2.33.1",
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.27",
    # ── Image & Video ──
    "opencv-python==4.13.0.92",
    "numpy==2.3.2",
    "imageio-ffmpeg==0.6.0",
    # ── Documents ──
    "PyMuPDF==1.27.2.3",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    # ── Utils ──
    "watchfiles==1.1.1",
    "aiofiles==25.1.0",
    "orjson==3.11.8",
    "markdown==3.10.2",
    "fpdf2==2.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.16",
]
windows = [
    "pywin32==311",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E402",  # module import not at top (circular dep avoidance)
    "E501",  # line too long (line-length handles this)
    "F841",  # F841: pre-existing unused vars — clean up incrementally
    "RUF001", # ambiguous char in string (русский текст)
    "RUF002", # ambiguous char in docstring (русский текст)
    "RUF003", # ambiguous char in comment (русский текст)
    "RUF013", # implicit Optional (pre-existing)
    "W291",  # trailing whitespace (pre-existing in strings)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:llama_index.",
    "ignore::UserWarning:whisperx",
]
